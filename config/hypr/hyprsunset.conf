# Morning/startup — no filter until work begins
profile {
    time = 6:00
    temperature = 6500
}

# Work hours — mild filter for bright room
profile {
    time = 9:00
    temperature = 5100
}

# After work — gradual warmth as ambient light drops
profile {
    time = 17:00
    temperature = 4200
}

# Night — strong filter for wind-down
profile {
    time = 20:00
    temperature = 4200
    gamma = 0.85
}
