background {
    monitor =
    path = ~/dotfiles/wallpapers/cloudy.png
    blur_size = 4
    blur_passes = 2
    brightness = 0.5
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(C6A0F6)
    inner_color = rgb(24273A)
    font_color = rgb(CAD3F5)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false

    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(CAD3F5ff)
    font_size = 55
    font_family = JetBrains Mono

    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(B8C0E0ff)
    font_size = 18
    font_family = JetBrains Mono

    position = 0, 130
    halign = center
    valign = center
}
