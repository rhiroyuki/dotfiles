# Monitor configuration
monitor = , 2560x1440@120, auto, 1

# Catppuccin Macchiato
$rosewater = rgba(F4DBD6ff)
$flamingo  = rgba(F0C6C6ff)
$pink      = rgba(F5BDE6ff)
$mauve     = rgba(C6A0F6ff)
$red       = rgba(ED8796ff)
$maroon    = rgba(EE99A0ff)
$peach     = rgba(F5A97Fff)
$green     = rgba(A6DA95ff)
$teal      = rgba(8BD5CAff)
$sky       = rgba(91D7E3ff)
$sapphire  = rgba(7DC4E4ff)
$blue      = rgba(8AADF4ff)
$lavender  = rgba(B7BDF8ff)
$text      = rgba(CAD3F5ff)
$subtext1  = rgba(B8C0E0ff)
$subtext0  = rgba(A5ADCBff)
$overlay2  = rgba(939AB7ff)
$overlay1  = rgba(8087A2ff)
$overlay0  = rgba(6E738Dff)
$surface2  = rgba(5B6078ff)
$surface1  = rgba(494D64ff)
$surface0  = rgba(363A4Fff)
$base      = rgba(24273Aff)
$mantle    = rgba(1E2030ff)
$crust     = rgba(181926ff)

# ALT   = Alt (Mod1)
# SUPER = Super/Windows key (Mod4)

general {
    gaps_in = 5
    gaps_out = 0
    border_size = 1
    col.active_border = $mauve $lavender 45deg
    col.inactive_border = $overlay0
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

input {
    kb_layout = us
    kb_variant = intl
    kb_options = ctrl:nocaps,lv3:ralt_alt
    repeat_delay = 300
    repeat_rate = 30
    follow_mouse = 1

    touchpad {
        natural_scroll = false
        tap-to-click = true
        disable_while_typing = true
    }
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# Wallpaper
exec-once = uwsm app -- hyprpaper

# Autostart (uwsm app -- ensures apps run as proper systemd units)
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- nm-applet --indicator
exec-once = uwsm app -- blueman-applet
exec-once = uwsm app -- hyprsunset
exec-once = uwsm app -- fcitx5 -d
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store
exec-once = uwsm app -- dunst
exec-once = $HOME/.config/hypr/bin/launch_waybar

# Speech-to-text (handy)
bind = SUPER, T, exec, bash -c 'handy --toggle-transcription; f=/tmp/handy_state; if [ -f "$f" ]; then rm "$f"; notify-send -t 1500 "Handy" "OFF"; else touch "$f"; notify-send -t 1500 "Handy" "ON"; fi'

# Lock screen
bind = SUPER, L, exec, hyprlock

# Volume up
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10% && notify-send -t 1500 "Volume" "$(pactl get-sink-volume @DEFAULT_SINK@ | grep -oP '\d+(?=%)' | head -1)%"
# Volume down
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10% && notify-send -t 1500 "Volume" "$(pactl get-sink-volume @DEFAULT_SINK@ | grep -oP '\d+(?=%)' | head -1)%"
# Toggle mute
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle && notify-send -t 1500 "Volume" "$(pactl get-sink-mute @DEFAULT_SINK@ | grep -q yes && echo Muted || echo Unmuted)"
# Toggle mic mute
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle && notify-send -t 1500 "Mic" "$(pactl get-source-mute @DEFAULT_SOURCE@ | grep -q yes && echo Muted || echo Unmuted)"

# Brightness up
bindel = , XF86MonBrightnessUp, exec, ~/.config/waybar/custom/brightness.sh up && notify-send -t 1500 "Brightness" "$(cat /tmp/hyprsunset_gamma)%"
# Brightness down
bindel = , XF86MonBrightnessDown, exec, ~/.config/waybar/custom/brightness.sh down && notify-send -t 1500 "Brightness" "$(cat /tmp/hyprsunset_gamma)%"

# Play/pause media
bindl = , XF86AudioPlay, exec, playerctl play-pause && notify-send -t 1500 "Media" "$(playerctl status): $(playerctl metadata title)"
# Pause media
bindl = , XF86AudioPause, exec, playerctl pause && notify-send -t 1500 "Media" "Paused: $(playerctl metadata title)"
# Next track
bindl = , XF86AudioNext, exec, playerctl next && notify-send -t 1500 "Media" "Next: $(playerctl metadata title)"
# Previous track
bindl = , XF86AudioPrev, exec, playerctl previous && notify-send -t 1500 "Media" "Previous: $(playerctl metadata title)"

# Start a terminal
bind = ALT CTRL, T, exec, ghostty

# File explorer
bind = SUPER, E, exec, nemo

# Screenshot (region to clipboard)
bind = SUPER, Print, exec, grim -g "$(slurp)" - | swappy -f -

# Kill focused window
bind = ALT SHIFT, Q, killactive

# Launcher
bind = ALT, Return, exec, $HOME/.config/hypr/bin/launcher
# Emoji
bind = ALT, E, exec, rofi -show emoji
# Powermenu (shutdown, suspend, reboot, log out)
bind = SUPER, P, exec, $HOME/.config/hypr/bin/powermenu

# Clipboard history
bind = ALT CTRL, F, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy
# Show keybindings
bind = ALT SHIFT, slash, exec, $HOME/.config/hypr/bin/keybindings

# Focus left
bind = ALT, H, movefocus, l
# Focus down
bind = ALT, J, movefocus, d
# Focus up
bind = ALT, K, movefocus, u
# Focus right
bind = ALT, L, movefocus, r

# Focus left
bind = ALT, left, movefocus, l
# Focus down
bind = ALT, down, movefocus, d
# Focus up
bind = ALT, up, movefocus, u
# Focus right
bind = ALT, right, movefocus, r

# Move window left
bind = ALT SHIFT, H, movewindow, l
# Move window down
bind = ALT SHIFT, J, movewindow, d
# Move window up
bind = ALT SHIFT, K, movewindow, u
# Move window right
bind = ALT SHIFT, L, movewindow, r

# Move window left
bind = ALT SHIFT, left, movewindow, l
# Move window down
bind = ALT SHIFT, down, movewindow, d
# Move window up
bind = ALT SHIFT, up, movewindow, u
# Move window right
bind = ALT SHIFT, right, movewindow, r

# Split horizontal
bind = SUPER, H, layoutmsg, preselect l
# Split vertical
bind = SUPER, V, layoutmsg, preselect d

# Toggle fullscreen
bind = ALT, F, fullscreen, 0

# Layout: toggle split
bind = ALT, T, layoutmsg, togglesplit

# Toggle tiling / floating
bind = ALT SHIFT, space, togglefloating

# Toggle a persistent float rule for the focused window's class (asks to confirm)
bind = ALT SHIFT, F, exec, $HOME/.config/hypr/bin/float-window

# Change focus between tiling / floating windows
bind = ALT, space, cyclenext

# Reload the configuration file
bind = ALT SHIFT, C, exec, hyprctl reload && notify-send "Hyprland" "Config reloaded"
# Exit hyprland
bind = ALT SHIFT, E, exec, uwsm stop

# Mouse: drag and resize floating windows
bindm = ALT, mouse:272, movewindow
bindm = ALT, mouse:273, resizewindow

# Switch to workspace 1
bind = ALT, 1, workspace, 1
# Switch to workspace 2
bind = ALT, 2, workspace, 2
# Switch to workspace 3
bind = ALT, 3, workspace, 3
# Switch to workspace 4
bind = ALT, 4, workspace, 4
# Switch to workspace 5
bind = ALT, 5, workspace, 5
# Switch to workspace 6
bind = ALT, 6, workspace, 6
# Switch to workspace 7
bind = ALT, 7, workspace, 7
# Switch to workspace 8
bind = ALT, 8, workspace, 8
# Switch to workspace 9
bind = ALT, 9, workspace, 9
# Switch to workspace 10
bind = ALT, 0, workspace, 10

# Move container to workspace 1
bind = ALT SHIFT, 1, movetoworkspace, 1
# Move container to workspace 2
bind = ALT SHIFT, 2, movetoworkspace, 2
# Move container to workspace 3
bind = ALT SHIFT, 3, movetoworkspace, 3
# Move container to workspace 4
bind = ALT SHIFT, 4, movetoworkspace, 4
# Move container to workspace 5
bind = ALT SHIFT, 5, movetoworkspace, 5
# Move container to workspace 6
bind = ALT SHIFT, 6, movetoworkspace, 6
# Move container to workspace 7
bind = ALT SHIFT, 7, movetoworkspace, 7
# Move container to workspace 8
bind = ALT SHIFT, 8, movetoworkspace, 8
# Move container to workspace 9
bind = ALT SHIFT, 9, movetoworkspace, 9
# Move container to workspace 10
bind = ALT SHIFT, 0, movetoworkspace, 10

# Previous workspace
bind = ALT SHIFT, Tab, workspace, e-1
# Next workspace
bind = ALT, Tab, workspace, e+1

# Enter resize mode
bind = ALT, R, submap, resize

submap = resize

# Shrink width
binde = , H, resizeactive, -30 0
# Grow height
binde = , J, resizeactive, 0 30
# Shrink height
binde = , K, resizeactive, 0 -30
# Grow width
binde = , L, resizeactive, 30 0

# Shrink width
binde = , left, resizeactive, -30 0
# Grow height
binde = , down, resizeactive, 0 30
# Shrink height
binde = , up, resizeactive, 0 -30
# Grow width
binde = , right, resizeactive, 30 0

# Exit resize mode
bind = , Return, submap, reset
# Exit resize mode
bind = , Escape, submap, reset
# Exit resize mode
bind = ALT, R, submap, reset

submap = reset

# Float rules
windowrule = match:class blueman-manager, float on
windowrule = match:class yad, match:title yad-calendar, float on
# float-window confirmation dialog (bin/float-window)
windowrule = match:class yad, match:title Float window, float on
