<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Subpixel antialiasing (best for standard LCD monitors) -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>

  <!-- Slight hinting: preserves glyph shapes better than full/medium -->
  <match target="font">
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- Explicit DPI to avoid Wayland compositor inconsistencies -->
  <match target="pattern">
    <edit name="dpi" mode="assign">
      <double>96</double>
    </edit>
  </match>

  <!-- Web font substitutions: map common MS font names to their
       Liberation/Noto equivalents when ttf-ms-fonts is not installed.
       When ttf-ms-fonts IS installed these bindings are unused. -->
  <alias>
    <family>Arial</family>
    <prefer><family>Arial</family></prefer>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <alias>
    <family>Helvetica</family>
    <prefer><family>Helvetica</family></prefer>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <alias>
    <family>Verdana</family>
    <prefer><family>Verdana</family></prefer>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <alias>
    <family>Times New Roman</family>
    <prefer><family>Times New Roman</family></prefer>
    <accept><family>Liberation Serif</family></accept>
  </alias>
  <alias>
    <family>Times</family>
    <prefer><family>Times</family></prefer>
    <accept><family>Liberation Serif</family></accept>
  </alias>
  <alias>
    <family>Georgia</family>
    <prefer><family>Georgia</family></prefer>
    <accept><family>Liberation Serif</family></accept>
  </alias>
  <alias>
    <family>Courier New</family>
    <prefer><family>Courier New</family></prefer>
    <accept><family>Liberation Mono</family></accept>
  </alias>
  <alias>
    <family>Courier</family>
    <prefer><family>Courier</family></prefer>
    <accept><family>Liberation Mono</family></accept>
  </alias>
  <alias>
    <family>Trebuchet MS</family>
    <prefer><family>Trebuchet MS</family></prefer>
    <accept><family>Liberation Sans</family></accept>
  </alias>
  <alias>
    <family>Tahoma</family>
    <prefer><family>Tahoma</family></prefer>
    <accept><family>Liberation Sans</family></accept>
  </alias>
</fontconfig>
